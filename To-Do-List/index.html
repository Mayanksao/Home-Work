<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="relative">
    <div
      class="absolute bg-[#0078DA] w-150 h-64 top-65 left-90 flex-col rounded"
    >
      <div class="flex">
        <img
          src="./pngtree-clipboard-checklist-icon-in-cartoon-style-vector-png-image_18649588-removebg-preview.png"
          alt="To-Do-List"
          class="w-10 h-auto"
        />
        <div class="flex-col font-bold">
          <h1 id="todo-txt"><b>Todo List</b></h1>
          <h2>Keep track of your daily tasks</h2>
        </div>
      </div>

      <form class="input-form">
        <input
          type="text"
          placeholder=" Enter a task..."
          class="bg-[#1CB1FB] text-white rounded w-100"
          id="task-btn"
        />

        <input type="submit" value="Add" class="border-2" id="add-btn" />

        <input
          type="search"
          name="Search"
          id="search-btn"
          placeholder="Search items ..."
          class="bg-[#1CB1FB] text-white rounded w-50"
        />
      </form>

      <ul id="ul-list" class="ul-lists">
        <li class="items border-2">
          Item-1
          <input
            type="button"
            value="X"
            class="border-2 bg-red-600 delete"
            id="del-btn"
          />
        </li>
        <li class="items border-2">
          Item-2
          <input
            type="button"
            value="X"
            class="border-2 bg-red-600 delete"
            id="del-btn"
          />
        </li>
        <li class="items border-2">
          Item-3
          <input
            type="button"
            value="X"
            class="border-2 bg-red-600 delete"
            id="del-btn"
          />
        </li>
        <li class="items border-2">
          Item-4
          <input
            type="button"
            value="X"
            class="border-2 bg-red-600 delete"
            id="del-btn"
          />
        </li>
      </ul>

      <ul class="ul-list-2" id="ul-list-2"></ul>
    </div>

    <script src="dom.js" />
  </body>
</html>
