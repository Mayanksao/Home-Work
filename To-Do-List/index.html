<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="relative">
    <div
      class="absolute bg-[#0078DA] w-150 h-100 top-65 left-90 flex-col rounded-2xl"
    >
      <div class="flex">
        <img
          src="./pngtree-clipboard-checklist-icon-in-cartoon-style-vector-png-image_18649588-removebg-preview.png"
          alt="To-Do-List"
          class="w-10 h-auto"
        />
        <div class="flex-col font-bold">
          <h1><b>Todo List</b></h1>
          <h2>Keep track of your daily tasks</h2>
        </div>
      </div>
      <div class="#">
        <input
          type="text"
          placeholder=" Enter a task..."
          class="bg-[#1CB1FB] text-white rounded w-100"
        />
        <button class="bg-[#00D6FF] text-2xl ">
          Add Todo
        </button>
        <div class="flex items-center-center ">No todos yet...</div>
      </div>
    </div>
  </body>
</html>
